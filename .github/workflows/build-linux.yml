name: Build Linux App (GLIBC 2.35 / ubuntu-22.04)

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            g++ \
            ffmpeg \
            tesseract-ocr \
            cmake \
            clang-14 \
            libavformat-dev \
            libavfilter-dev \
            libavdevice-dev \
            libssl-dev \
            libtesseract-dev \
            libxdo-dev \
            libsdl2-dev \
            libclang-14-dev \
            libxtst-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            curl \
            pkg-config \
            libsqlite3-dev \
            libbz2-dev \
            zlib1g-dev \
            libonig-dev \
            libayatana-appindicator3-dev \
            libsamplerate-dev \
            libwebrtc-audio-processing-dev \
            libpipewire-0.3-dev \
            libpipewire-0.3-modules \
            libspa-0.2-modules \
            pipewire-bin \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            xdg-desktop-portal-gtk \
            libsecret-1-dev \
            libopenblas-dev

      - name: Setup OpenBLAS path
        run: |
          sudo mkdir -p /usr/lib/x86_64-linux-gnu/openblas/lib
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libopenblas.so /usr/lib/x86_64-linux-gnu/openblas/lib/liblibopenblas.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libopenblas.a /usr/lib/x86_64-linux-gnu/openblas/lib/liblibopenblas.a
          echo "OPENBLAS_PATH=/usr/lib/x86_64-linux-gnu/openblas" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        run: npm install -g bun

      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "screenpipe-linux-2204-v1"
          cache-directories: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/screenpipe-app-tauri/src-tauri/target

      - name: Install frontend dependencies
        working-directory: apps/screenpipe-app-tauri
        run: bun install

      - name: Run pre_build.js
        working-directory: apps/screenpipe-app-tauri
        run: bun ./scripts/pre_build.js
        env:
          SCREENPIPE_RELEASE_TARGET: x86_64-unknown-linux-gnu

      - name: Build Tauri app (deb only, GLIBC 2.35)
        working-directory: apps/screenpipe-app-tauri
        run: bunx tauri build --verbose --target x86_64-unknown-linux-gnu --features redact-onnx-cpu --bundles deb

      - name: Verify GLIBC version
        run: |
          BIN=apps/screenpipe-app-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/screenpipe
          echo "=== objdump GLIBC 依赖符号 ==="
          objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | uniq
          echo "=== ldd 版本 ==="
          ldd --version | head -1

      - name: Find bundles
        run: |
          find apps/screenpipe-app-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -type f -name "*.deb" -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenpipe-linux-deb-glibc235
          path: apps/screenpipe-app-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error
