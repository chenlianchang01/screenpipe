name: Build Linux App (GLIBC 2.35 / ubuntu-22.04)

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Add PipeWire upstream PPA (ubuntu-22.04 ships 0.3.48, too old for libspa 0.9.2)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:pipewire-debian/pipewire-upstream
          sudo apt-get update

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            g++ \
            ffmpeg \
            tesseract-ocr \
            cmake \
            clang-14 \
            libavformat-dev \
            libavfilter-dev \
            libavdevice-dev \
            libssl-dev \
            libtesseract-dev \
            libxdo-dev \
            libsdl2-dev \
            libclang-14-dev \
            libxtst-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            curl \
            pkg-config \
            libsqlite3-dev \
            libbz2-dev \
            zlib1g-dev \
            libonig-dev \
            libayatana-appindicator3-dev \
            libsamplerate-dev \
            libwebrtc-audio-processing-dev \
            libpipewire-0.3-dev \
            libpipewire-0.3-modules \
            libspa-0.2-modules \
            pipewire-bin \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            xdg-desktop-portal-gtk \
            libsecret-1-dev \
            libopenblas-dev \
            binutils
          echo "=== PipeWire version ==="
          pkg-config --modversion libpipewire-0.3

      - name: Download glibc2.17 ONNX Runtime static lib (avoid pyke GLIBC 2.38)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 -o ort-static.zip "https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.24.4/onnxruntime-linux-x64-static_lib-1.24.4-glibc2_17.zip"
          unzip -q ort-static.zip
          ORT_LIB="$RUNNER_TEMP/onnxruntime-linux-x64-static_lib-1.24.4-glibc2_17/lib"
          test -f "$ORT_LIB/libonnxruntime.a"
          echo "ORT_LIB_PATH=$ORT_LIB" >> "$GITHUB_ENV"
          ls -lh "$ORT_LIB"

      - name: Setup OpenBLAS path
        run: |
          sudo mkdir -p /usr/lib/x86_64-linux-gnu/openblas/lib
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libopenblas.so /usr/lib/x86_64-linux-gnu/openblas/lib/liblibopenblas.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libopenblas.a /usr/lib/x86_64-linux-gnu/openblas/lib/liblibopenblas.a
          echo "OPENBLAS_PATH=/usr/lib/x86_64-linux-gnu/openblas" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        run: npm install -g bun

      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "screenpipe-linux-2204-v3"
          cache-directories: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/screenpipe-app-tauri/src-tauri/target

      - name: Install frontend dependencies
        working-directory: apps/screenpipe-app-tauri
        run: bun install

      - name: Run pre_build.js
        working-directory: apps/screenpipe-app-tauri
        run: bun ./scripts/pre_build.js
        env:
          SCREENPIPE_RELEASE_TARGET: x86_64-unknown-linux-gnu

      - name: Build Tauri app (deb only, GLIBC 2.35)
        working-directory: apps/screenpipe-app-tauri
        run: bunx tauri build --verbose --target x86_64-unknown-linux-gnu --features redact-onnx-cpu --bundles deb
        env:
          ORT_LIB_PATH: ${{ env.ORT_LIB_PATH }}

      - name: Verify GLIBC floor (<= 2.35)
        run: |
          set -e
          BIN=apps/screenpipe-app-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/screenpipe
          echo "=== 主二进制 GLIBC 依赖符号 ==="
          objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | uniq
          echo "=== 最高 GLIBC 版本 ==="
          MAX=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "max = $MAX"
          echo "=== 检查 GLIBC 2.36+ 与 __isoc23 (2.38 标志) ==="
          HIGH=$(objdump -T "$BIN" | grep -oE 'GLIBC_2\.(3[6-9]|[4-9][0-9])' | sort -u || true)
          ISOC=$(objdump -T "$BIN" | grep -c '__isoc23' || true)
          echo "high=[$HIGH] isoc23_count=$ISOC"
          if [ -n "$HIGH" ] || [ "$ISOC" != "0" ]; then echo "::error::GLIBC floor exceeds 2.35 (high=$HIGH isoc23=$ISOC)"; exit 1; fi
          echo "=== 扫描产物内所有 .so 的最高 GLIBC ==="
          find apps/screenpipe-app-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release -name "*.so" -print0 | while IFS= read -r -d '' so; do
            echo "$so -> $(objdump -T "$so" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)"
          done
          echo "=== 构建机 glibc ==="
          ldd --version | head -1
          echo "GLIBC FLOOR CHECK PASSED"

      - name: Find bundles
        run: |
          find apps/screenpipe-app-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -type f -name "*.deb" -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenpipe-linux-deb-glibc235
          path: apps/screenpipe-app-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error
